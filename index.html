<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SystemUpgrade Roadmap</title><meta name="theme-color" content="#0f172a"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="icon" href="favicon.ico">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="UpgradeRoadmap"><link rel="stylesheet" href="css/styles.css"></head><body>
<header><h1><img src="images/logo-header.svg" alt="">SystemUpgrade Roadmap</h1><span id="net" class="badge">Online</span><span id="stor" class="m" style="color:#94a3b8"></span><button id="inst" hidden class="pri">Install app</button></header>
<nav id="nav"><button data-s="life" class="on">Lifecycle registry</button><button data-s="pit">Upgrade pitches</button><button data-s="dat">Data and archive</button></nav>
<main>
<section id="life" class="on"><div class="bar"><select id="fc"><option value="">All subsystems</option></select><select id="fs"><option value="">All statuses</option></select><button id="addA" class="pri">Add asset</button></div>
<form id="fa" hidden></form><div class="tw"><table id="ta"></table></div></section>
<section id="pit"><div class="bar"><select id="fy"></select><select id="fw"><option value="">All stages</option></select><button id="addP" class="pri">New pitch</button></div><form id="fp" hidden></form><div id="lp"></div></section>
<section id="dat"><div class="bar"><button id="ej">Export JSON backup</button><label><input type="file" id="ij" accept=".json" hidden><button type="button" onclick="ij.click()">Restore JSON</button></label><select id="mm"><option value="merge">Merge</option><option value="over">Overwrite</option></select><button id="ec1">Export roadmap CSV</button><button id="ec2">Export pitches CSV</button><button id="snap">Save archive snapshot</button></div><div id="info" class="card"></div></section>
</main><script src="js/app.js"></script></body></html>
