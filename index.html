<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SystemUpgrade Roadmap</title><meta name="theme-color" content="#0f172a"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="icon" href="favicon.ico">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="UpgradeRoadmap"><link rel="stylesheet" href="css/styles.css"></head><body>
<header><h1><img src="images/logo-header.svg" alt="">SystemUpgrade Roadmap</h1><span id="net" class="badge">Online</span><span id="stor" class="m"></span><button id="inst" hidden class="pri" data-action="install">Install app</button><button data-action="help">? Help &amp; Guide</button><button data-action="settings">&#9881; Settings</button></header>
<div class="wrap"><div class="kpis" id="kpis"></div>
<nav id="nav"><button data-action="tab" data-s="life" class="on">Lifecycle registry</button><button data-action="tab" data-s="pit">Upgrade pitches</button><button data-action="tab" data-s="dat">Data and archive</button></nav>
<details class="rib" open><summary>How it works: click any step</summary><div class="flow"><button data-action="step" data-n="1"><b>Step 1: Audit lifecycle</b><span>Add or filter critical Wonderware nodes</span></button><i>&#10140;</i><button data-action="step" data-n="2"><b>Step 2: Pitch upgrade</b><span>Propose a feature and set target KPIs</span></button><i>&#10140;</i><button data-action="step" data-n="3"><b>Step 3: Advance stage</b><span>Move pitches through stakeholder approval</span></button><i>&#10140;</i><button data-action="step" data-n="4"><b>Step 4: Verify and snapshot</b><span>Log actual post-upgrade metrics and archive</span></button></div></details></div>
<main>
<section id="life" class="on"><div class="bar"><div class="sb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="qa" data-q="a" placeholder="Search SCADA nodes, versions, or subsystems..."><button data-action="clr" data-k="a" hidden>&times;</button></div><select id="fc" data-f="cat"></select><select id="fs" data-f="status"></select><button class="pri" data-action="addA">Add asset</button></div><div class="tw" id="ta"></div><div id="pa"></div></section>
<section id="pit"><div class="bar"><div class="sb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="qp" data-q="p" placeholder="Search upgrade pitches, problems, or KPIs..."><button data-action="clr" data-k="p" hidden>&times;</button></div><select id="fy" data-f="year"></select><select id="fw" data-f="stage"></select><button class="pri" data-action="addP">New pitch</button></div><div id="lp"></div><div id="pp"></div></section>
<section id="dat"><div class="bar"><button data-action="ej">Export JSON backup</button><button data-action="rj">Restore JSON</button><input type="file" id="ij" accept=".json" hidden><select id="mm"><option value="merge">Merge</option><option value="over">Overwrite</option></select><button data-action="ec1">Export roadmap CSV</button><button data-action="ec2">Export pitches CSV</button><button class="pri" data-action="snap">Save archive snapshot</button></div><div id="info" class="card"></div><h3>Saved snapshots</h3><div class="tw" id="sn"></div></section>
</main><div class="toast" id="toast"></div><dialog id="dlg"><div id="dc"></div></dialog>
<div id="tour"><div id="spot"></div><div id="coach"></div></div><script src="js/app.js"></script></body></html>
